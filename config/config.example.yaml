# Konfigurasjon for Hjemmepanel.
#
# Kopier denne fila til config/config.yaml og tilpass den. config.yaml er
# ikke med i git, så dine IP-adresser og valg blir liggende lokalt.

server:
  host: 0.0.0.0     # 0.0.0.0 = tilgjengelig fra andre maskiner på hjemmenettet
  port: 8000

dashboard:
  title: Hjemmepanel
  # Skjermen har én eller flere sider man sveiper mellom. Hver side har en
  # layout: en "tegning" av skjermen, rad for rad. Hvert ord er id-en til et
  # kort (lights, bus, bus1, weather, clock, music ...). Gjenta en id for å la
  # kortet dekke flere celler. Alle rader på en side må ha like mange ord.
  pages:
    - name: Hjem
      layout:
        - "lights lights bus"
        - "lights lights weather"
    # Ta med denne når Spotify er satt opp (se spotify: under):
    # - name: Musikk
    #   layout:
    #     - "music"
  # Gå tilbake til første side etter så mange sekunder uten berøring (0 = aldri)
  home_after_seconds: 0

lights:
  # true = simulerte pærer i minnet, fint for å utvikle og teste på PC.
  # (Sett ip: unreachable på en simulert pære for å se hvordan "ingen kontakt" vises.)
  simulate: true
  timeout_seconds: 3
  poll_interval_seconds: 10
  # Bytt til f.eks. 192.168.1.255 hvis søk etter pærer ikke finner noe.
  broadcast_address: 255.255.255.255
  scenes_file: config/scenes.json
  # Finn IP og MAC med:  python scripts/discover_bulbs.py
  # Tips: gi pærene fast IP i ruteren (DHCP-reservasjon), da slipper du at
  # adressene endrer seg. Med mac satt finner appen pæra igjen uansett.
  bulbs:
    - id: stue_vindu
      name: Stue vindu
      ip: 192.168.1.51
      mac: null
    - id: stue_sofa
      name: Stue sofa
      ip: 192.168.1.52
      mac: null
    - id: kjokken
      name: Kjøkken
      ip: 192.168.1.53
      mac: null
    - id: soverom
      name: Soverom
      ip: 192.168.1.54
      mac: null

bus:
  enabled: true
  # Én eller flere holdeplasser. Finn id med:  python scripts/find_stop.py "Navn"
  # Med flere holdeplasser viser kortet "bus" alle, mens "bus1", "bus2" ... i
  # layouten gir ett kort per holdeplass.
  stops:
    - stop_place_id: NSR:StopPlace:58366   # Jernbanetorget (eksempel – bytt til din)
      name: null                            # null = navnet fra Entur
      line_filter: []                       # f.eks. ["31", "37"] for å vise bare disse
    # - stop_place_id: NSR:StopPlace:xxxxx
    #   name: Kjøbenhavngata
  client_name: privat-hjemmepanel       # Entur krever en identifikator (firma-app)
  number_of_departures: 10
  time_range_seconds: 7200
  refresh_seconds: 30

weather:
  enabled: true
  # Finn koordinater med:  python scripts/find_place.py "Stedsnavn"
  place_name: Oslo
  lat: 59.9139
  lon: 10.7522
  # MET krever at appen identifiserer seg med e-post eller nettadresse.
  user_agent: "hjemmepanel/1.0 (bytt-meg@example.com)"
  refresh_seconds: 600
  hours: 6
  days: 3

# Musikk = Sonos (avspilling, rom, volum – lokalt på nettet) + Spotify
# (spillelister og cover). Se README, "Musikk (Sonos + Spotify)".
sonos:
  enabled: false
  simulate: false          # true = fire falske rom for å se siden på PC
  # Tom liste = finn høyttalerne automatisk. Virker ikke søk (extender/mesh),
  # oppgi IP til én høyttaler – resten finnes via den. IP står i Sonos-appen
  # under Innstillinger → System → Om systemet.
  speakers: []
  # speakers:
  #   - ip: 10.0.0.20
  default_room: null       # rommet som er valgt ved oppstart, f.eks. Stue
  refresh_seconds: 3

spotify:
  # Spillelistene dine (og cover) fra Spotify. Uten Sonos brukes Spotify også
  # til avspilling (Spotify Connect). Krever Premium og en gratis "app" hos
  # developer.spotify.com – se README.
  enabled: false
  simulate: false          # true = falske spillelister/spiller for å se siden på PC
  client_id: ""            # Client ID fra developer.spotify.com/dashboard
  redirect_uri: http://127.0.0.1:8888/callback   # må stå likt i appen hos Spotify
  token_file: config/spotify_token.json          # lages av scripts/spotify_login.py
  refresh_seconds: 5
  default_device: null     # f.eks. Stue – rommet som brukes når ingenting spiller
  playlist_limit: 30

buttons:
  # Fysiske knapper koblet til GPIO på Pi-en (valgfritt, se README).
  enabled: false
  buttons:
    - gpio: 17
      action: scene
      scene: kveld
    - gpio: 27
      action: toggle_all
